[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-docs-api"
version = "0.1.0"
description = "agent-docs API: publish, view, and version history for plain-HTML documents."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.0",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27",
    "pytest>=8.0",
]
postgres = [
    "psycopg[binary]>=3.1",
]

[tool.setuptools.package-data]
app = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
